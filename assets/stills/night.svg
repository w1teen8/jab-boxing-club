<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="The gym empty at night, ring ropes under one overhead light">
  <defs>
    <linearGradient id="k4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15161a"/><stop offset=".52" stop-color="#1b1d21"/><stop offset="1" stop-color="#0d0e10"/>
    </linearGradient>
    <radialGradient id="pool" cx="50%" cy="8%" r="62%">
      <stop offset="0" stop-color="#cfc6b2" stop-opacity=".48"/><stop offset=".5" stop-color="#8a8273" stop-opacity=".14"/><stop offset="1" stop-color="#8a8273" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rope" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b4740" stop-opacity=".5"/><stop offset=".5" stop-color="#cdc4b1"/><stop offset="1" stop-color="#4b4740" stop-opacity=".5"/>
    </linearGradient>
    <filter id="grain4" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.46"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#k4)"/>
  <ellipse cx="800" cy="60" rx="760" ry="520" fill="url(#pool)"/>
  <g stroke="url(#rope)" stroke-linecap="round" fill="none">
    <path d="M60 430 Q800 452 1540 430" stroke-width="9"/>
    <path d="M60 540 Q800 566 1540 540" stroke-width="10"/>
    <path d="M60 656 Q800 686 1540 656" stroke-width="11"/>
  </g>
  <rect x="152" y="392" width="16" height="320" rx="8" fill="#2b2a27"/>
  <rect x="1432" y="392" width="16" height="320" rx="8" fill="#2b2a27"/>
  <rect x="0" y="724" width="1600" height="176" fill="#0b0c0e" opacity=".72"/>
  <rect x="0" y="722" width="1600" height="3" fill="#9c9484" opacity=".3"/>
  <rect width="1600" height="900" filter="url(#grain4)" opacity=".24" style="mix-blend-mode:overlay"/>
