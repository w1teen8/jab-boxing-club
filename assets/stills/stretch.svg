<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="The floor at the end of a class, lit cool and low">
  <defs>
    <filter id="tgr" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.44"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#101318"/>
  <ellipse cx="800" cy="300" rx="900" ry="420" fill="#2447c8" opacity=".2"/>
  <g fill="#9fb0e6" opacity=".16">
    <rect x="0" y="474" width="1600" height="3"/>
    <rect x="0" y="588" width="1600" height="4"/>
    <rect x="0" y="736" width="1600" height="5"/>
  </g>
  <ellipse cx="640" cy="690" rx="340" ry="52" fill="#2447c8" opacity=".3"/>
  <rect x="0" y="800" width="1600" height="100" fill="#090b0e" opacity=".8"/>
  <rect width="1600" height="900" filter="url(#tgr)" opacity=".24" style="mix-blend-mode:overlay"/>
</svg>
