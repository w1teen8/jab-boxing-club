<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Skipping rope arcs during a warm up">
  <defs>
    <radialGradient id="uk" cx="50%" cy="78%" r="76%">
      <stop offset="0" stop-color="#8b8273"/><stop offset=".44" stop-color="#34322d"/><stop offset="1" stop-color="#111214"/>
    </radialGradient>
    <linearGradient id="ur" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cdc4b1" stop-opacity=".15"/><stop offset=".5" stop-color="#f1ebdd" stop-opacity=".9"/><stop offset="1" stop-color="#cdc4b1" stop-opacity=".15"/>
    </linearGradient>
    <filter id="ub" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="ugr" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.87" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.42"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#uk)"/>
  <g fill="none" stroke="url(#ur)" stroke-linecap="round" filter="url(#ub)">
    <path d="M520 760 Q800 60 1080 760" stroke-width="7" opacity=".9"/>
    <path d="M440 790 Q800 -40 1160 790" stroke-width="5" opacity=".55"/>
    <path d="M600 740 Q800 180 1000 740" stroke-width="9" opacity=".7"/>
  </g>
  <ellipse cx="800" cy="812" rx="420" ry="46" fill="#0b0c0e" opacity=".6"/>
  <rect x="0" y="828" width="1600" height="72" fill="#0c0d0f" opacity=".8"/>
  <rect width="1600" height="900" filter="url(#ugr)" opacity=".22" style="mix-blend-mode:overlay"/>
</svg>
