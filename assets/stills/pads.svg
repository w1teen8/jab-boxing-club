<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Pad work with a coach, the moment of contact">
  <defs>
    <radialGradient id="pk" cx="50%" cy="52%" r="64%">
      <stop offset="0" stop-color="#7d7466"/><stop offset=".4" stop-color="#32302b"/><stop offset="1" stop-color="#0f1012"/>
    </radialGradient>
    <radialGradient id="psh" cx="50%" cy="50%" r="50%">
      <stop offset=".55" stop-color="#ce2b22" stop-opacity="0"/><stop offset=".82" stop-color="#ce2b22" stop-opacity=".5"/><stop offset="1" stop-color="#ce2b22" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pm" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#d9d2c3"/><stop offset="1" stop-color="#4a4640"/>
    </linearGradient>
    <filter id="pb" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="pgr" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#pk)"/>
  <g filter="url(#pb)" opacity=".8">
    <rect x="-60" y="300" width="620" height="300" rx="150" fill="url(#pm)" transform="rotate(8 250 450)"/>
    <rect x="1040" y="280" width="660" height="320" rx="160" fill="url(#pm)" transform="rotate(-10 1370 440)" opacity=".85"/>
  </g>
  <circle cx="800" cy="450" r="300" fill="url(#psh)"/>
  <rect x="690" y="392" width="230" height="116" rx="58" fill="#efe9dc" opacity=".95"/>
  <rect x="722" y="412" width="166" height="76" rx="38" fill="#ce2b22" opacity=".22"/>
  <rect width="1600" height="900" filter="url(#pgr)" opacity=".2" style="mix-blend-mode:overlay"/>
</svg>
