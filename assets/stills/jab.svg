<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A jab in slow motion, trailing streaks">
  <defs>
    <radialGradient id="jk" cx="68%" cy="46%" r="70%">
      <stop offset="0" stop-color="#6e6558"/><stop offset=".38" stop-color="#2c2b27"/><stop offset="1" stop-color="#101114"/>
    </radialGradient>
    <linearGradient id="js" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9e2d3" stop-opacity="0"/><stop offset=".72" stop-color="#e9e2d3" stop-opacity=".55"/><stop offset="1" stop-color="#fdfbf5" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="jr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ce2b22" stop-opacity="0"/><stop offset="1" stop-color="#ce2b22" stop-opacity=".8"/>
    </linearGradient>
    <filter id="jb" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="jgr" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#jk)"/>
  <g filter="url(#jb)">
    <rect x="120" y="398" width="980" height="26" rx="13" fill="url(#js)"/>
    <rect x="240" y="352" width="820" height="12" rx="6" fill="url(#js)" opacity=".7"/>
    <rect x="300" y="448" width="760" height="16" rx="8" fill="url(#js)" opacity=".8"/>
    <rect x="420" y="492" width="600" height="9" rx="5" fill="url(#js)" opacity=".5"/>
    <rect x="200" y="316" width="700" height="7" rx="4" fill="url(#jr)" opacity=".75"/>
    <rect x="360" y="536" width="620" height="7" rx="4" fill="url(#jr)" opacity=".6"/>
  </g>
  <ellipse cx="1118" cy="412" rx="92" ry="78" fill="#f4efe3" opacity=".9" filter="url(#jb)"/>
  <ellipse cx="1150" cy="404" rx="34" ry="30" fill="#fffdf7" opacity=".95"/>
  <rect width="1600" height="900" filter="url(#jgr)" opacity=".2" style="mix-blend-mode:overlay"/>
</svg>
