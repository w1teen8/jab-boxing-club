<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Hand wraps being taped, close up">
  <defs>
    <radialGradient id="wk" cx="26%" cy="20%" r="78%">
      <stop offset="0" stop-color="#9a9183"/><stop offset=".42" stop-color="#3b3933"/><stop offset="1" stop-color="#121315"/>
    </radialGradient>
    <linearGradient id="wt" x1="0" y1="0" x2=".9" y2=".45">
      <stop offset="0" stop-color="#ece5d7"/><stop offset=".55" stop-color="#aba393"/><stop offset="1" stop-color="#524d45"/>
    </linearGradient>
    <linearGradient id="wt2" x1="0" y1="0" x2=".9" y2=".45">
      <stop offset="0" stop-color="#d8d1c2"/><stop offset=".6" stop-color="#8e8778"/><stop offset="1" stop-color="#3a3631"/>
    </linearGradient>
    <filter id="wdof" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="wgr" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.42"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#wk)"/>
  <g transform="rotate(-16 800 450)" filter="url(#wdof)" opacity=".5">
    <rect x="-100" y="140" width="1900" height="74" rx="37" fill="url(#wt2)"/>
    <rect x="-100" y="690" width="1900" height="86" rx="43" fill="url(#wt2)"/>
  </g>
  <g transform="rotate(-16 800 450)">
    <rect x="-120" y="300" width="1900" height="96" rx="48" fill="url(#wt)"/>
    <rect x="-120" y="416" width="1900" height="62" rx="31" fill="url(#wt2)"/>
    <rect x="-120" y="500" width="1900" height="104" rx="52" fill="url(#wt)" opacity=".92"/>
  </g>
  <g transform="rotate(74 800 450)" opacity=".55">
    <rect x="-120" y="392" width="1900" height="58" rx="29" fill="url(#wt2)"/>
  </g>
  <ellipse cx="400" cy="210" rx="520" ry="300" fill="#e8e1d2" opacity=".07"/>
  <rect width="1600" height="900" filter="url(#wgr)" opacity=".22" style="mix-blend-mode:overlay"/>
